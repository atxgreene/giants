# Continuous web deployment: every push to main exports the browser build
# (single-threaded WASM — no special headers needed, works on phones) and
# publishes the site: landing page at / and the playable game at /play/.
name: deploy-web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Export web build + assemble site
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable

      - name: Stamp build version (lets the menu show which build is live)
        run: |
          mkdir -p assets
          # The godot-ci container's default shell is dash (sh), which lacks the
          # bash substring `${VAR:0:7}` — use cut so this stays POSIX-portable.
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          printf '{"sha":"%s","ref":"%s"}' "$SHA" "$GITHUB_REF_NAME" > assets/build_info.json
          cat assets/build_info.json

      - name: Import assets (fails on parse/compile errors)
        run: godot --headless --import

      - name: Export web build
        run: |
          mkdir -p site/play
          godot --headless --export-release "Web" site/play/index.html

      - name: Assemble site (landing page + game)
        run: cp -r docs/* site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
